    /**

     * 1. RICH MYSTIC SOUND ENGINE (Web Audio API Synthesizer)

     */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        const icon = document.getElementById('sound-icon');
        if (this.muted) {
          icon.className = 'fa-solid fa-volume-xmark text-slate-500';
          app.showToast('サウンドをミュートしました', 'info');
        } else {
          this.init();
          icon.className = 'fa-solid fa-volume-high text-emerald-400';
          this.playCrystalChime();
          app.showToast('サウンドをオンにしました', 'success');
        }
      }

      playTone(freq, type, duration, delay = 0, volume = 0.14) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.03);
      }

      playTap() {
        this.playTone(640, 'sine', 0.07, 0, 0.1);
      }

      // 水晶共鳴音
      playCrystalChime() {
        this.playTone(880, 'sine', 0.3, 0, 0.12);
        this.playTone(1318.51, 'sine', 0.4, 0.06, 0.11);
        this.playTone(1760, 'triangle', 0.45, 0.12, 0.07);
      }

      // カード並び替え音
      playSwap() {
        this.playTone(460, 'triangle', 0.08, 0, 0.12);
        this.playTone(690, 'triangle', 0.1, 0.05, 0.12);
      }

      // 共鳴リンク接続音
      playResonanceLock() {
        this.playTone(587.33, 'sine', 0.18, 0, 0.14);
        this.playTone(880, 'triangle', 0.24, 0.07, 0.14);
        this.playTone(1174.66, 'sine', 0.35, 0.14, 0.12);
      }

      // 天秤の傾き＆判定音
      playScaleTilt(isAscending) {
        // 揺れる金属音
        this.playTone(720, 'sine', 0.15, 0, 0.1);
        this.playTone(680, 'sine', 0.15, 0.14, 0.1);
        if (isAscending) {
          this.playTone(523.25, 'sine', 0.22, 0.32, 0.15);
          this.playTone(659.25, 'sine', 0.22, 0.42, 0.15);
          this.playTone(783.99, 'triangle', 0.4, 0.52, 0.16);
        } else {
          this.playTone(392.00, 'triangle', 0.22, 0.32, 0.15);
          this.playTone(311.13, 'sawtooth', 0.4, 0.46, 0.13);
        }
      }

      // 禁句アラート音
      playTabooAlert() {
        this.playTone(440, 'square', 0.12, 0, 0.1);
        this.playTone(349.23, 'square', 0.18, 0.1, 0.1);
      }

      // カードめくり音（成功時は高く澄んだ音、失敗時はクリスタル砕け音）
      playCardFlip(index = 0, isMistake = false) {
        if (isMistake) {
          // クリスタル砕け音（不協和音＋高周波ノイズ風）
          this.playTone(233.08, 'sawtooth', 0.28, 0, 0.16);
          this.playTone(220.00, 'sawtooth', 0.32, 0.04, 0.16);
          this.playTone(146.83, 'square', 0.4, 0.1, 0.15);
          this.playTone(1480, 'triangle', 0.08, 0.02, 0.12);
          this.playTone(1120, 'triangle', 0.1, 0.07, 0.12);
        } else {
          const base = 440 + index * 46;
          this.playTone(base, 'triangle', 0.15, 0, 0.14);
          this.playTone(base * 1.5, 'sine', 0.28, 0.05, 0.13);
        }
      }

      // ファンファーレ
      playFanfare() {
        const chord = [523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51];
        chord.forEach((freq, i) => {
          this.playTone(freq, 'sine', 0.45, i * 0.07, 0.14);
          this.playTone(freq * 0.5, 'triangle', 0.45, i * 0.07, 0.08);
        });
      }

        const notes = [1046.50, 1318.51, 1567.98, 2093.00];
        notes.forEach((freq, i) => {
          this.playTone(freq, 'sine', 0.38, i * 0.06, 0.14);
        });

        this.playTone(220, 'sawtooth', 0.25, 0, 0.14);
        this.playTone(185, 'sawtooth', 0.3, 0.15, 0.14);
        this.playTone(138.59, 'sawtooth', 0.48, 0.3, 0.15);
      }
    }

        }

      // Topic & Taboo Generators
      pickTopic(categoryKey) {
        if (categoryKey === 'custom') {
          const title = this.state.customTopic.title.trim() || '好きなものの度合い';
          const min = this.state.customTopic.min.trim() || '1：弱い / 少ない';
          const max = this.state.customTopic.max.trim() || '100：最強 / 最高';
          return { title, min, max, categoryName: 'カスタム調合題', categoryIcon: 'fa-pen-nib', categoryColor: 'bg-amber-600' };
        }

        let pool = [];
        if (categoryKey === 'all') {
          Object.values(TOPIC_CATEGORIES).forEach(cat => {
            cat.topics.forEach(t => {
              pool.push({ ...t, categoryName: cat.name, categoryIcon: cat.icon, categoryColor: cat.color });
            });
          });
        } else {
          const cat = TOPIC_CATEGORIES[categoryKey] || TOPIC_CATEGORIES.daily;
          pool = cat.topics.map(t => ({ ...t, categoryName: cat.name, categoryIcon: cat.icon, categoryColor: cat.color }));
        }

        let available = pool.filter(t => !this.state.usedTopicTitles.includes(t.title));
        if (available.length === 0) {
          this.state.usedTopicTitles = [];
          available = pool;
        }

        const chosen = available[Math.floor(Math.random() * available.length)];
        this.state.usedTopicTitles.push(chosen.title);
        return chosen;
      },

      pickRandomTaboo() {
        if (!this.state.enableTabooMode) return null;
        return TABOO_RULES[Math.floor(Math.random() * TABOO_RULES.length)];
      },

      shuffleTopicAndTaboo() {
        sound.playSwap();
        if (this.state.selectedCategory === 'custom') {
          this.openCustomTopicModal();
          return;

        this.state.currentTopic = this.pickTopic(this.state.selectedCategory);
        if (this.state.enableTabooMode) {
          this.state.currentTaboo = this.pickRandomTaboo();

        this.showToast('新しいテーマを召喚しました！', 'info');
        this.render();
      },

      saveCustomTopicFromModal() {
        const titleInput = document.getElementById('modal-custom-title').value.trim();
        const minInput = document.getElementById('modal-custom-min').value.trim();
        const maxInput = document.getElementById('modal-custom-max').value.trim();

        if (!titleInput) {
          this.showToast('お題タイトルを入力してください', 'warn');
          return;
        }
        this.state.customTopic = {
          title: titleInput,
          min: minInput || '1：弱い / 少ない',
          max: maxInput || '100：最強 / 最高'
        };
        this.state.selectedCategory = 'custom';
        if (this.state.phase !== 'setup') {
          this.state.currentTopic = this.pickTopic('custom');
        }
        this.closeModal();
        this.showToast('カスタムお題を設定しました！', 'success');
        this.render();
      },

      // Deal Unique Numbers (1-100) & Value Lenses
      dealNumbersAndLenses(count) {
        const numPool = Array.from({ length: 100 }, (_, i) => i + 1);
        for (let i = numPool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [numPool[i], numPool[j]] = [numPool[j], numPool[i]];
        }
        const numbers = numPool.slice(0, count);

        let lenses = [];
        if (!this.state.enableLensMode) {
          lenses = Array.from({ length: count }, () => VALUE_LENSES[0]);
        } else {
          // Ensure at least 1 'sage' (normal) lens and unique special lenses
          const specialPool = [...VALUE_LENSES.slice(1)];
          for (let i = specialPool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [specialPool[i], specialPool[j]] = [specialPool[j], specialPool[i]];
          }
          const rawLenses = [VALUE_LENSES[0], ...specialPool.slice(0, count - 1)];
          for (let i = rawLenses.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [rawLenses[i], rawLenses[j]] = [rawLenses[j], rawLenses[i]];
          }
          lenses = rawLenses;
        }

        return { numbers, lenses };
      },

      // Start Campaign
      startGame() {
        sound.init();
        sound.playFanfare();

        if (this.state.selectedCategory === 'custom' && !this.state.customTopic.title.trim()) {
          this.showToast('カスタムお題を入力してください', 'warn');
          return;
        }

        this.state.currentRound = 1;
        this.state.totalScore = 0;
        this.state.roundHistory = [];
        this.state.usedTopicTitles = [];

        this.startNewRound();
      },

      startNewRound() {
        this.clearRevealTimers();
        const count = this.state.playerCount;
        const { numbers, lenses } = this.dealNumbersAndLenses(count);

        this.state.players = Array.from({ length: count }, (_, idx) => {
          const rawName = (this.state.playerNames[idx] || '').trim();
          return {
            id: `p_${idx}_${Date.now()}`,
            name: rawName || `錬金術師${idx + 1}`,
            colorIdx: idx % PLAYER_PALETTE.length,
            number: numbers[idx],
            lens: lenses[idx],
            hint: ''
          };
        });

        this.state.currentTopic = this.pickTopic(this.state.selectedCategory);
        this.state.currentTaboo = this.pickRandomTaboo();
        this.state.dealIndex = 0;
        this.state.isSecretRevealed = false;
        this.state.resonanceLinkIdx = null;
        this.state.crystalUsed = false;
        this.state.crystalResult = null;
        this.state.phase = 'deal';
        this.render();
      },

      // Deal Phase: Secret Check & Pre-input Hint
      toggleSecretReveal() {
        this.state.isSecretRevealed = !this.state.isSecretRevealed;
        if (this.state.isSecretRevealed) {
          sound.playCrystalChime();
        } else {
          sound.playTap();
        }
        this.render();
      },

      updateDealPlayerHint(val) {
        const idx = this.state.dealIndex;
        if (this.state.players[idx]) {
          this.state.players[idx].hint = val;
        }
      },

      nextDealPlayer() {
        sound.playTap();
        this.state.isSecretRevealed = false;
        if (this.state.dealIndex + 1 < this.state.players.length) {
          this.state.dealIndex++;
          this.render();

              </button>
              <button onclick="app.closeModal(); app.startReveal();" class="py-3 rounded-2xl bg-gradient-to-r from-amber-500 to-emerald-400 text-alch-bg font-black shadow-btn-3d btn-tactile">
                せーの、オープン！
              </button>

          </div>
        `);
      },

      clearRevealTimers() {
        if (this.state.revealTimers && this.state.revealTimers.length) {
          this.state.revealTimers.forEach(t => clearTimeout(t));
        }
        this.state.revealTimers = [];
      },

      // Grand Reveal Phase
      startReveal() {
        this.clearRevealTimers();
        const players = this.state.players;
        const mistakeIndices = [];

        for (let i = 1; i < players.length; i++) {
          if (players[i].number < players[i - 1].number) {
            mistakeIndices.push(i);
          }
        }

        const success = mistakeIndices.length === 0;

        // Check Resonance Link (Ascending & Diff <= 10)
        let resonanceHit = false;
        let resonanceDiff = null;
        let resonancePairNames = null;
        if (this.state.resonanceLinkIdx !== null && this.state.resonanceLinkIdx < players.length - 1) {
          const pA = players[this.state.resonanceLinkIdx];
          const pB = players[this.state.resonanceLinkIdx + 1];
          resonanceDiff = Math.abs(pB.number - pA.number);
          resonancePairNames = `${pA.name} & ${pB.name}`;
          if (pA.number < pB.number && resonanceDiff <= 10) {
            resonanceHit = true;
          }
        }

        // Calculate Synchro Rate (0% - 100%)
        const sortedIds = [...players].sort((a, b) => a.number - b.number).map(p => p.id);
        let displacementSum = 0;
        players.forEach((p, currentIdx) => {
          const idealIdx = sortedIds.indexOf(p.id);
          displacementSum += Math.abs(currentIdx - idealIdx);
        });
        const maxPossibleDisplacement = Math.floor((players.length * players.length) / 2) || 1;
        let synchroRate = Math.max(0, Math.round(100 - (displacementSum / maxPossibleDisplacement) * 85));
        if (success) {
          synchroRate = resonanceHit ? 100 : Math.min(99, 93 + players.length);
        }

        // Calculate Score
        let roundPoints = 0;
        if (success) {
          roundPoints += 100;
          if (!this.state.crystalUsed && this.state.enableScaleCrystal) roundPoints += 20;
          if (resonanceHit) roundPoints += 50;
        } else {
          roundPoints += Math.round(synchroRate * 0.4);
          if (resonanceHit) roundPoints += 30;
        }

        this.state.revealResult = {
          success,
          mistakeIndices,
          resonanceHit,
          resonanceDiff,
          resonancePairNames,
          synchroRate,
          roundPoints
        };

        this.state.revealStep = 0;
        this.state.isRevealing = true;
        this.state.phase = 'reveal';
        this.render();

        // Sequential card flip
        players.forEach((_, idx) => {
          const timerId = setTimeout(() => {
            this.state.revealStep = idx + 1;
            const isMistake = mistakeIndices.includes(idx);
            const cardEl = document.getElementById(`reveal-card-${idx}`);
            if (cardEl) cardEl.classList.add('is-flipped');
            sound.playCardFlip(idx, isMistake);

            if (isMistake) {
              const shakeTimer = setTimeout(() => {
                const wrapper = document.getElementById(`reveal-wrapper-${idx}`);
                if (wrapper) wrapper.classList.add('animate-shake');
              }, 260);
              this.state.revealTimers.push(shakeTimer);
            }

            if (idx === players.length - 1) {
              const finishTimer = setTimeout(() => {
                this.finishRevealSequence();
              }, 750);
              this.state.revealTimers.push(finishTimer);
            }
          }, 680 * (idx + 1));
          this.state.revealTimers.push(timerId);
        });
      },

      skipRevealAnimation() {
        if (!this.state.isRevealing) return;
        this.clearRevealTimers();
        const players = this.state.players;
        this.state.revealStep = players.length;

        players.forEach((_, idx) => {
          const cardEl = document.getElementById(`reveal-card-${idx}`);
          if (cardEl) cardEl.classList.add('is-flipped');
        });
        this.finishRevealSequence();
      },

      finishRevealSequence() {
        if (!this.state.isRevealing) return;
        this.clearRevealTimers();
        this.state.isRevealing = false;
        const res = this.state.revealResult;

        this.state.totalScore += res.roundPoints;
        this.state.roundHistory.push({
          round: this.state.currentRound,
          topicTitle: this.state.currentTopic.title,
          success: res.success,
          resonanceHit: res.resonanceHit,
          resonancePairNames: res.resonancePairNames,
          resonanceDiff: res.resonanceDiff,
          synchroRate: res.synchroRate,
          points: res.roundPoints
        });

        if (res.success) {
          sound.playFanfare();
          if (res.resonanceHit) {
            setTimeout(() => sound.playPerfectResonance(), 450);
          }
          if (typeof confetti === 'function') {
            confetti({
              particleCount: res.resonanceHit ? 150 : 95,
              spread: 85,
              origin: { y: 0.6 },
              colors: ['#F59E0B', '#10B981', '#06B6D4', '#8B5CF6', '#F43F5E']
            });
          }
        } else {
          sound.playDiscord();
        }
        this.render();
      },

      nextRoundOrFinish() {
        sound.playTap();
        if (this.state.currentRound >= this.state.totalRounds) {
          sound.playFanfare();
          this.state.phase = 'final';
          this.render();
          if (typeof confetti === 'function') {
            confetti({
              particleCount: 120,
              spread: 90,
              origin: { y: 0.55 },
              colors: ['#F59E0B', '#10B981', '#06B6D4', '#8B5CF6']
            });
          }
        } else {
          this.state.currentRound++;
          this.startNewRound();
        }
      },

      getFinalTeamDiagnosis() {
        const history = this.state.roundHistory;
        const avgSynchro = Math.round(history.reduce((acc, r) => acc + r.synchroRate, 0) / (history.length || 1));
        const successCount = history.filter(r => r.success).length;
        const requirePerfectAll = successCount === history.length && history.length > 0;

        // Best resonance pair
        const resonanceHits = history.filter(r => r.resonanceHit && r.resonancePairNames);
        let bestPairText = 'なし（次回は共鳴リンク的中を狙おう！）';
        if (resonanceHits.length > 0) {
          resonanceHits.sort((a, b) => a.resonanceDiff - b.resonanceDiff);
          bestPairText = `${resonanceHits[0].resonancePairNames}（数字差 ${resonanceHits[0].resonanceDiff}）`;
        }

        const matchedTitle = TEAM_TITLES.find(t => {
          if (t.requirePerfectAll) {
            return requirePerfectAll && avgSynchro >= t.minSynchro;
          }
          return avgSynchro >= t.minSynchro;
        }) || TEAM_TITLES[TEAM_TITLES.length - 1];

        return {
          avgSynchro,
          successCount,
          totalRounds: history.length,
          bestPairText,
          teamTitle: matchedTitle
        };
      },

      copyShareText() {
        sound.playTap();
        const diag = this.getFinalTeamDiagnosis();
        const memberNames = this.state.players.map(p => p.name).join('・');
        const shareText = [
          `🧪『シンクロ・アルケミスト 〜価値観調合の儀〜』結果報告`,
          `👑 チーム称号：【${diag.teamTitle.title}】`,
          `✨ 平均シンクロ率：${diag.avgSynchro}%（調合成功 ${diag.successCount}/${diag.totalRounds}回）`,
          `💎 総合スコア：${this.state.totalScore} pt`,
          `🔗 ベスト共鳴ペア：${diag.bestPairText}`,
          `👥 参加メンバー：${memberNames}`,
          `#シンクロアルケミスト #価値観合わせゲーム`
        ].join('\n');

        const textarea = document.createElement('textarea');
        textarea.value = shareText;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          this.showToast('結果シェア用テキストをクリップボードにコピーしました！', 'success');
        } catch (err) {
          this.showToast('コピーに失敗しました', 'error');
        }
        document.body.removeChild(textarea);
      },

      /**
       * ============================================================================
       * 4. VIEW RENDERERS
       * ============================================================================
       */
      updateHeaderStatus() {
        const statusEl = document.getElementById('header-status');
        if (this.state.phase === 'setup') {
          statusEl.classList.add('hidden');
          statusEl.classList.remove('flex');
          return;
        }
        statusEl.classList.remove('hidden');
        statusEl.classList.add('flex');

        statusEl.innerHTML = `
          <span class="text-amber-300 font-num"><i class="fa-solid fa-compass mr-1"></i>R${this.state.currentRound}/${this.state.totalRounds}</span>
          <span class="text-white/20">|</span>
          <span class="text-emerald-400 font-num"><i class="fa-solid fa-gem mr-1"></i>${this.state.totalScore} pt</span>
        `;
      },

      render() {
        this.updateHeaderStatus();
        const container = document.getElementById('app-container');

        switch (this.state.phase) {
          case 'setup':
            container.innerHTML = this.renderSetupView();
            break;
          case 'deal':
            container.innerHTML = this.renderDealView();
            break;
          case 'discuss':
            container.innerHTML = this.renderDiscussView();
            break;
          case 'reveal':
            container.innerHTML = this.renderRevealView();
            break;
          case 'final':
            container.innerHTML = this.renderFinalResultView();
            break;
        }
      },

      // --------------------------------------------------------------------------
      // VIEW 1: SETUP SCREEN
      // --------------------------------------------------------------------------
      renderSetupView() {
        const counts = [2, 3, 4, 5, 6, 7, 8];
        const countButtons = counts.map(c => {
          const active = this.state.playerCount === c;
          return `
            <button onclick="app.setPlayerCount(${c})" class="py-2.5 rounded-xl font-num font-black text-sm sm:text-base transition btn-tactile ${
              active
                ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-alch-bg shadow-gold-glow'
                : 'bg-alch-bg/80 hover:bg-alch-panel text-slate-300 border border-white/10'

              ${c}人
            </button>
          `;
        }).join('');

        let playerInputs = '';
        for (let i = 0; i < this.state.playerCount; i++) {
          const pColor = PLAYER_PALETTE[i % PLAYER_PALETTE.length];
          playerInputs += `
            <div class="flex items-center gap-2.5 bg-alch-bg/85 p-2 rounded-xl border border-white/10 focus-within:border-amber-400/70 transition">

              </span>
              <input

                class="w-full bg-transparent font-bold text-sm text-white focus:outline-none placeholder:text-slate-500"
              >
            </div>
          `;
        }

        const roundOptions = [
          { count: 1, label: '1ラウンド', sub: 'サクッと1本勝負' },
          { count: 3, label: '3ラウンド', sub: '標準・称号診断あり' },
          { count: 5, label: '5ラウンド', sub: 'じっくり白熱バトル' }
        ];

        const roundButtons = roundOptions.map(r => {
          const active = this.state.totalRounds === r.count;
          return `
            <button onclick="app.setTotalRounds(${r.count})" class="p-3 rounded-2xl border text-center transition btn-tactile ${
              active
                ? 'border-amber-400 bg-amber-500/15 shadow-gold-glow'
                : 'border-white/10 bg-alch-bg/70 hover:border-white/25'
            }">
              <div class="font-black text-xs sm:text-sm ${active ? 'text-amber-300' : 'text-white'}">${r.label}</div>
              <div class="text-[10px] sm:text-[11px] text-slate-400 mt-0.5">${r.sub}</div>
            </button>
          `;
        }).join('');

        const categories = [
          { key: 'all', name: 'すべて（全90問）', icon: 'fa-shuffle', color: 'bg-gradient-to-r from-amber-500 to-emerald-500' },

          { key: 'custom', name: 'カスタムお題作成', icon: 'fa-pen-nib', color: 'bg-indigo-600' }
        ];

        const categoryCards = categories.map(cat => {
          const active = this.state.selectedCategory === cat.key;
          return `
            <button onclick="app.setCategory('${cat.key}')" class="p-3 rounded-2xl border text-left transition flex items-center gap-2.5 btn-tactile ${

                ? 'border-amber-400 bg-amber-500/15 shadow-gold-glow'
                : 'border-white/10 bg-alch-bg/70 hover:border-white/25'
            }">
              <span class="w-9 h-9 rounded-xl ${cat.color} text-white flex items-center justify-center shrink-0 shadow-sm">

              </span>

                </div>
              </div>

          `;
        }).join('');

        const customTopicForm = this.state.selectedCategory === 'custom' ? `
          <div class="mt-4 p-4 rounded-2xl bg-alch-bg/90 border border-dashed border-amber-400/50 space-y-3 animate-pop-in">
            <div class="text-xs font-black text-amber-300 flex items-center gap-1.5">
              <i class="fa-solid fa-pen-nib"></i>自由にお題と1〜100の基準を設定
            </div>
            <input
              type="text"
              value="${this.escapeHtml(this.state.customTopic.title)}"
              oninput="app.updateCustomTopicField('title', this.value)"
              placeholder="お題を入力（例：無人島に持っていきたいもの）"
              class="w-full px-3.5 py-2.5 rounded-xl bg-alch-panel border border-white/15 focus:border-amber-400 focus:outline-none text-sm font-bold text-white"
            >
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <input
                type="text"
                value="${this.escapeHtml(this.state.customTopic.min)}"
                oninput="app.updateCustomTopicField('min', this.value)"
                placeholder="1の基準（例：いらない）"
                class="w-full px-3 py-2 rounded-xl bg-alch-panel border border-sky-500/35 focus:border-sky-400 focus:outline-none text-xs font-bold text-white"
              >
              <input
                type="text"
                value="${this.escapeHtml(this.state.customTopic.max)}"
                oninput="app.updateCustomTopicField('max', this.value)"
                placeholder="100の基準（例：絶対必須！）"
                class="w-full px-3 py-2 rounded-xl bg-alch-panel border border-rose-500/35 focus:border-rose-400 focus:outline-none text-xs font-bold text-white"
              >
            </div>
          </div>
        ` : '';

        return `
          <div class="max-w-3xl w-full mx-auto space-y-5 sm:space-y-6 animate-pop-in">
            <!-- Hero Banner -->
            <div class="bg-gradient-to-br from-alch-surface via-alch-panel to-indigo-950 rounded-3xl p-5 sm:p-8 shadow-mystic border border-amber-500/35 text-center relative overflow-hidden">
              <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-500/15 border border-amber-400/35 text-amber-300 text-[11px] sm:text-xs font-black mb-2.5">
                <i class="fa-solid fa-sparkles"></i> 心理推理 × 価値観シンクロ・パーティゲーム
              </div>
              <h2 class="text-xl sm:text-3xl md:text-4xl font-black text-white tracking-tight mb-2">
                言葉の錬金術で、<span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-200 to-emerald-300">心の数字</span>を調合せよ。
              </h2>
              <p class="text-xs sm:text-sm text-slate-300 max-w-xl mx-auto leading-relaxed">
                秘密の数字「1〜100」と、思考を歪める「価値観レンズ」を手に、言葉の例えだけで1→100の昇順に並び替えよう！
              </p>
            </div>

            <!-- Step 1: Players (2-8) & Name Tools -->
            <div class="bg-alch-surface rounded-3xl p-4 sm:p-6 shadow-mystic border border-white/10">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <h3 class="font-black text-base sm:text-lg text-white flex items-center gap-2">
                  <span class="w-7 h-7 rounded-xl bg-amber-500 text-alch-bg font-num font-black text-sm flex items-center justify-center">1</span>
                  参加人数と錬金術師名
                </h3>
                <div class="flex items-center gap-1.5">
                  <button onclick="app.shufflePlayerNames()" class="px-2.5 py-1 rounded-lg bg-alch-panel hover:bg-indigo-900 text-amber-300 border border-amber-400/30 text-[11px] font-bold flex items-center gap-1 transition">
                    <i class="fa-solid fa-shuffle"></i> 名前シャッフル
                  </button>
                  <button onclick="app.resetPlayerNames()" class="px-2.5 py-1 rounded-lg bg-alch-panel hover:bg-indigo-900 text-slate-300 border border-white/15 text-[11px] font-bold flex items-center gap-1 transition">
                    <i class="fa-solid fa-rotate-left"></i> リセット
                  </button>
                </div>
              </div>

              <div class="grid grid-cols-7 gap-1.5 sm:gap-2 mb-4">
                ${countButtons}
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                ${playerInputs}
              </div>
            </div>

            <!-- Step 2: Rounds & Original Gimmick Toggles -->
            <div class="bg-alch-surface rounded-3xl p-4 sm:p-6 shadow-mystic border border-white/10">
              <h3 class="font-black text-base sm:text-lg text-white flex items-center gap-2 mb-3">
                <span class="w-7 h-7 rounded-xl bg-purple-500 text-white font-num font-black text-sm flex items-center justify-center">2</span>
                ラウンド数＆オリジナルギミック設定
              </h3>

              <!-- Round Selection -->
              <div class="grid grid-cols-3 gap-2 sm:gap-3 mb-4">
                ${roundButtons}
              </div>

              <!-- 3 Gimmick Toggles -->
              <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                <!-- Lens Toggle -->
                <div onclick="app.toggleOption('enableLensMode')" class="cursor-pointer p-3.5 rounded-2xl border-2 transition ${
                  this.state.enableLensMode
                    ? 'bg-purple-950/55 border-purple-400 shadow-md'
                    : 'bg-alch-bg/60 border-white/10 opacity-70'
                }">
                  <div class="flex items-center justify-between mb-1">
                    <span class="font-black text-xs sm:text-sm text-purple-300 flex items-center gap-1.5">
                      <i class="fa-solid fa-glasses"></i>価値観レンズ
                    </span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-black ${
                      this.state.enableLensMode ? 'bg-purple-500 text-white' : 'bg-slate-700 text-slate-300'
                    }">
                      ${this.state.enableLensMode ? 'ON' : 'OFF'}
                    </span>
                  </div>
                  <p class="text-[11px] text-slate-300 leading-relaxed">
                    全10種の秘密の視点ロール（小学3年生・頑固オヤジ等）を配布！
                  </p>
                </div>

                <!-- Taboo Toggle -->
                <div onclick="app.toggleOption('enableTabooMode')" class="cursor-pointer p-3.5 rounded-2xl border-2 transition ${
                  this.state.enableTabooMode
                    ? 'bg-rose-950/55 border-rose-400 shadow-md'
                    : 'bg-alch-bg/60 border-white/10 opacity-70'
                }">
                  <div class="flex items-center justify-between mb-1">
                    <span class="font-black text-xs sm:text-sm text-rose-300 flex items-center gap-1.5">
                      <i class="fa-solid fa-ban"></i>禁句縛り
                    </span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-black ${
                      this.state.enableTabooMode ? 'bg-rose-500 text-white' : 'bg-slate-700 text-slate-300'
                    }">
                      ${this.state.enableTabooMode ? 'ON' : 'OFF'}
                    </span>
                  </div>
                  <p class="text-[11px] text-slate-300 leading-relaxed">
                    「カタカナ禁止」「名詞1単語のみ」等の表現制限が毎ラウンド発動！
                  </p>
                </div>

                <!-- Scale Crystal Toggle -->
                <div onclick="app.toggleOption('enableScaleCrystal')" class="cursor-pointer p-3.5 rounded-2xl border-2 transition ${
                  this.state.enableScaleCrystal
                    ? 'bg-cyan-950/55 border-cyan-400 shadow-md'
                    : 'bg-alch-bg/60 border-white/10 opacity-70'
                }">
                  <div class="flex items-center justify-between mb-1">
                    <span class="font-black text-xs sm:text-sm text-cyan-300 flex items-center gap-1.5">
                      <i class="fa-solid fa-scale-balanced"></i>真実の天秤
                    </span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-black ${
                      this.state.enableScaleCrystal ? 'bg-cyan-500 text-alch-bg' : 'bg-slate-700 text-slate-300'
                    }">
                      ${this.state.enableScaleCrystal ? '1回/R' : 'OFF'}
                    </span>
                  </div>
                  <p class="text-[11px] text-slate-300 leading-relaxed">
                    1ラウンド1回だけ選んだ2枚の大小関係を判定できるお助け水晶！
                  </p>
                </div>
              </div>
            </div>

            <!-- Step 3: Topic Category -->
            <div class="bg-alch-surface rounded-3xl p-4 sm:p-6 shadow-mystic border border-white/10">
              <h3 class="font-black text-base sm:text-lg text-white flex items-center gap-2 mb-3">
                <span class="w-7 h-7 rounded-xl bg-emerald-500 text-alch-bg font-num font-black text-sm flex items-center justify-center">3</span>
                お題のジャンルを選択
              </h3>

              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                ${categoryCards}
              </div>
              ${customTopicForm}
            </div>

            <!-- Start Button -->
            <button onclick="app.startGame()" class="w-full py-4 sm:py-5 rounded-3xl bg-gradient-to-r from-amber-500 via-amber-400 to-emerald-400 hover:brightness-105 text-alch-bg font-black text-lg sm:text-xl shadow-gold-glow btn-tactile flex items-center justify-center gap-3">
              <i class="fa-solid fa-wand-sparkles"></i>
              <span>調合の儀を開始する！</span>
            </button>
          </div>
        `;
      },

      // --------------------------------------------------------------------------
      // Reusable Topic & Taboo Banner
      // --------------------------------------------------------------------------
      renderTopicBanner(allowShuffle = true) {

        const taboo = this.state.currentTaboo;

        return `
          <div class="bg-alch-surface rounded-3xl p-4 sm:p-5 shadow-mystic border border-amber-500/30 relative">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
              <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full ${topic.categoryColor} text-white text-xs font-black shadow-sm">
                  <i class="fa-solid ${topic.categoryIcon}"></i>
                  ${this.escapeHtml(topic.categoryName)}
                </span>
                ${this.state.enableLensMode ? `
                  <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-purple-500/20 border border-purple-400/40 text-purple-300 text-[11px] font-black">
                    <i class="fa-solid fa-glasses"></i>価値観レンズON
                  </span>
                ` : ''}
              </div>

              ${allowShuffle ? `
                <button onclick="app.shuffleTopicAndTaboo()" class="px-3 py-1.5 rounded-xl bg-alch-panel hover:bg-indigo-900/80 border border-amber-400/25 text-amber-300 text-xs font-black flex items-center gap-1.5 transition btn-tactile">

            <div class="mt-2.5 bg-alch-bg/90 rounded-2xl p-3 border border-white/10">
              <div class="flex items-center justify-between gap-2 text-xs font-bold mb-1.5">
                <span class="text-sky-300 flex items-center gap-1.5">
                  <span class="px-1.5 py-0.5 rounded bg-sky-500/20 border border-sky-400/40 font-num font-black">1</span>
                  <span class="line-clamp-1">${this.escapeHtml(topic.min)}</span>
                </span>
                <span class="text-rose-300 flex items-center gap-1.5 text-right">
                  <span class="line-clamp-1">${this.escapeHtml(topic.max)}</span>
                  <span class="px-1.5 py-0.5 rounded bg-rose-500/20 border border-rose-400/40 font-num font-black">100</span>
                </span>
              </div>
              <div class="h-2 w-full rounded-full bg-gradient-to-r from-sky-400 via-amber-400 to-rose-500"></div>
            </div>

            ${taboo ? `
              <div class="mt-2.5 px-3.5 py-2.5 rounded-2xl bg-rose-950/65 border border-rose-500/45 flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-2.5 text-xs">
                <span class="inline-flex items-center self-start sm:self-auto px-2.5 py-0.5 rounded-lg bg-rose-500 text-white font-black shrink-0">
                  <i class="fa-solid fa-ban mr-1"></i>禁句縛り
                </span>
                <div>
                  <span class="font-black text-rose-200 mr-1.5">${this.escapeHtml(taboo.title)}</span>
                  <span class="text-rose-300/90">${this.escapeHtml(taboo.desc)}</span>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      },

      // --------------------------------------------------------------------------
      // VIEW 2: DEAL PHASE (Pass & Reveal - 秘密の調合)
      // --------------------------------------------------------------------------
      renderDealView() {
        const idx = this.state.dealIndex;
        const player = this.state.players[idx];
        const pColor = PLAYER_PALETTE[player.colorIdx];
        const total = this.state.players.length;
        const revealed = this.state.isSecretRevealed;

        return `
          <div class="max-w-xl w-full mx-auto space-y-4 sm:space-y-5 animate-pop-in">
            ${this.renderTopicBanner(true)}

            <!-- Progress Dots -->
            <div class="flex items-center justify-center gap-2">
              ${this.state.players.map((p, i) => `
                <div class="h-2 rounded-full transition-all ${
                  i === idx ? 'w-8 bg-amber-400 shadow-gold-glow' : i < idx ? 'w-3 bg-emerald-400' : 'w-3 bg-white/15'
                }"></div>
              `).join('')}
            </div>

            <!-- Secret Pass Card -->
            <div class="bg-alch-surface rounded-3xl p-5 sm:p-7 shadow-mystic border border-white/15 text-center">
              <span class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full border ${pColor.badge} text-xs font-black mb-2">
                <span>${idx + 1} / ${total} 人目</span>
              </span>

              <h3 class="text-2xl sm:text-3xl font-black text-white mb-1">
                ${this.escapeHtml(player.name)} <span class="text-base font-bold text-slate-300">さんの番です</span>
              </h3>
              <p class="text-xs font-bold text-rose-400 mb-4">
                <i class="fa-solid fa-eye-slash mr-1"></i>他の人は画面を見ないでください！
              </p>

              <!-- 2-Step Tap Secret Card -->
              <div onclick="app.toggleSecretReveal()" class="cursor-pointer mx-auto max-w-sm rounded-3xl transition-all duration-300 transform hover:scale-[1.01] active:scale-95 p-5 sm:p-6 border-2 ${
                revealed
                  ? 'parchment-card border-amber-500 shadow-gold-glow'
                  : 'alchemy-card-back border-amber-500/45 shadow-mystic'
              }">
                ${revealed ? `
                  <div class="font-display text-[11px] tracking-[0.25em] text-amber-800 font-bold">SECRET NUMBER</div>
                  <div class="font-num font-black text-7xl text-slate-900 my-1.5 tracking-tighter">
                    ${player.number}
                  </div>

                  ${this.state.enableLensMode ? `
                    <div class="mt-3 p-3.5 rounded-2xl bg-white/75 border border-amber-800/20 text-left">
                      <div class="text-[10px] font-bold text-amber-900/70 uppercase tracking-wider">あなたの価値観レンズ（秘密の視点）</div>
                      <div class="font-black text-sm sm:text-base text-slate-900 mt-0.5 flex items-center gap-1.5">
                        <i class="fa-solid ${player.lens.icon} text-amber-700"></i>
                        <span>${this.escapeHtml(player.lens.name)}</span>
                      </div>
                      <p class="text-xs text-slate-800 mt-1 leading-relaxed font-medium">
                        ${this.escapeHtml(player.lens.desc)}
                      </p>
                      <div class="mt-2 px-2.5 py-1.5 rounded-xl bg-amber-500/20 border border-amber-600/30 text-[11px] text-amber-950 font-bold">
                        <i class="fa-solid fa-lightbulb mr-1 text-amber-700"></i>${this.escapeHtml(player.lens.tip)}
                      </div>
                    </div>
                  ` : ''}

                  <div class="mt-3.5 text-xs font-bold text-amber-900/75 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-eye-slash"></i> タップして秘匿情報を隠す
                  </div>
                ` : `
                  <div class="py-8">
                    <div class="w-16 h-16 rounded-2xl bg-amber-500/15 border border-amber-400/40 flex items-center justify-center mx-auto mb-3">
                      <i class="fa-solid fa-hand-pointer text-3xl text-amber-300 animate-bounce"></i>
                    </div>
                    <div class="font-black text-lg text-white mb-1">タップして秘密を確認</div>
                    <div class="text-xs text-slate-400 font-bold">
                      ${this.state.enableLensMode ? '秘密の数字 ＆ 価値観レンズ' : '秘密の数字（1〜100）'}
                    </div>
                  </div>
                `}
              </div>

              <!-- Optional Pre-Input Metaphor Box (Shown when revealed) -->
              ${revealed ? `
                <div class="mt-4 max-w-sm mx-auto text-left animate-pop-in">
                  <label class="block text-xs font-black text-amber-300 mb-1">
                    <i class="fa-solid fa-pen-fancy mr-1"></i>自分の例えワード（事前メモ・任意）
                  </label>
                  <input
                    type="text"
                    maxlength="32"
                    value="${this.escapeHtml(player.hint)}"
                    oninput="app.updateDealPlayerHint(this.value)"
                    placeholder="口頭で発表 or ここに入力してもOK"
                    class="w-full px-3.5 py-2.5 rounded-xl bg-alch-bg border border-amber-400/40 focus:border-amber-400 focus:outline-none text-sm font-bold text-white placeholder:text-slate-500"
                  >
                </div>
              ` : ''}

              <!-- Lock & Next Button -->
              <div class="mt-5">
                <button onclick="app.nextDealPlayer()" class="w-full py-4 rounded-2xl font-black text-base sm:text-lg shadow-btn-3d btn-tactile flex items-center justify-center gap-2 transition ${
                  revealed
                    ? 'bg-gradient-to-r from-emerald-500 to-teal-500 text-alch-bg'
                    : 'bg-alch-panel hover:bg-indigo-900/80 text-white border border-white/15'
                }">
                  ${idx + 1 < total
                    ? `<i class="fa-solid fa-lock"></i><span>隠して次の人へ渡す</span><i class="fa-solid fa-arrow-right"></i>`
                    : `<i class="fa-solid fa-comments"></i><span>全員確認完了！調合ボードへ</span>`
                  }
                </button>
              </div>
            </div>
          </div>
        `;
      },

      // --------------------------------------------------------------------------
      // VIEW 3: DISCUSSION & ALCHEMY BOARD
      // --------------------------------------------------------------------------
      renderDiscussView() {
        const players = this.state.players;

        const cardsHtml = players.map((p, idx) => {
          const pColor = PLAYER_PALETTE[p.colorIdx];
          const isFirst = idx === 0;
          const isLast = idx === players.length - 1;
          const isLinkedLeft = this.state.resonanceLinkIdx === idx - 1;
          const isLinkedRight = this.state.resonanceLinkIdx === idx;
          const isLinked = isLinkedLeft || isLinkedRight;

          return `
            <div class="flex flex-col">
              <div
                draggable="true"
                ondragstart="app.handleDragStart(event, ${idx})"
                ondragend="app.handleDragEnd(event)"
                ondragover="app.handleDragOver(event)"
                ondragenter="app.handleDragEnter(event)"
                ondragleave="app.handleDragLeave(event)"
                ondrop="app.handleDrop(event, ${idx})"
                class="player-sort-card flex-1 bg-alch-surface rounded-3xl p-4 sm:p-5 shadow-mystic border-2 ${
                  isLinked ? 'border-amber-400 resonance-glow' : pColor.border
                } flex flex-col justify-between transition-all cursor-grab active:cursor-grabbing relative"
              >
                ${isLinked ? `
                  <div class="absolute -top-3 left-1/2 -translate-x-1/2 px-3 py-0.5 rounded-full bg-gradient-to-r from-amber-500 to-amber-400 text-alch-bg text-[10px] font-black shadow-md whitespace-nowrap">
                    <i class="fa-solid fa-link mr-1"></i>共鳴リンク中（差10以内予想）
                  </div>
                ` : ''}

                <!-- Card Header -->
                <div class="flex items-center justify-between gap-2 mb-3">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="w-7 h-7 rounded-xl bg-amber-500 text-alch-bg font-num font-black text-xs flex items-center justify-center shrink-0">
                      ${idx + 1}位
                    </span>
                    <span class="font-black text-base text-white truncate">
                      ${this.escapeHtml(p.name)}
                    </span>
                  </div>

                  <div class="flex items-center gap-1.5 shrink-0">
                    <button onclick="app.openPlayerSecretModal(${idx})" class="px-2.5 py-1 rounded-lg bg-alch-panel hover:bg-amber-500/20 border border-amber-400/30 text-amber-300 text-xs font-bold transition" title="自分の数字とレンズをこっそり再確認">
                      <i class="fa-solid fa-eye"></i> こっそり再確認
                    </button>
                    <span class="text-slate-500 hidden sm:inline px-0.5" title="ドラッグで並び替え">
                      <i class="fa-solid fa-grip-vertical"></i>
                    </span>
                  </div>
                </div>

                <!-- Metaphor Input -->
                <div class="my-1 p-3 rounded-2xl bg-alch-bg/90 border border-white/10">
                  <label class="block text-[11px] font-black ${pColor.text} mb-1">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>例えワード（リアルタイム編集）
                  </label>
                  <input
                    type="text"
                    maxlength="32"
                    value="${this.escapeHtml(p.hint)}"
                    oninput="app.updatePlayerHint(${idx}, this.value)"
                    placeholder="例：伝説の聖剣を抜いた瞬間"
                    class="w-full px-3 py-2 rounded-xl bg-alch-panel border border-white/10 focus:border-amber-400 focus:outline-none text-sm font-bold text-white placeholder:text-slate-500"
                  >
                </div>

                <!-- Move & Resonance Link Buttons -->
                <div class="mt-3 pt-2.5 border-t border-white/10 space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <button
                      onclick="app.movePlayerCard(${idx}, -1)"
                      ${isFirst ? 'disabled' : ''}
                      class="flex-1 py-2 px-2 rounded-xl font-black text-xs flex items-center justify-center gap-1 transition btn-tactile ${
                        isFirst
                          ? 'bg-white/5 text-slate-600 cursor-not-allowed'
                          : 'bg-sky-500/15 hover:bg-sky-500/25 text-sky-300 border border-sky-400/35'
                      }"
                    >
                      <i class="fa-solid fa-arrow-left"></i>
                      <span>小さい方へ</span>
                    </button>

                    <button
                      onclick="app.movePlayerCard(${idx}, 1)"
                      ${isLast ? 'disabled' : ''}
                      class="flex-1 py-2 px-2 rounded-xl font-black text-xs flex items-center justify-center gap-1 transition btn-tactile ${
                        isLast
                          ? 'bg-white/5 text-slate-600 cursor-not-allowed'
                          : 'bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border border-rose-400/35'
                      }"
                    >
                      <span>大きい方へ</span>
                      <i class="fa-solid fa-arrow-right"></i>
                    </button>
                  </div>

                  ${!isLast ? `
                    <button onclick="app.toggleResonanceLink(${idx})" class="w-full py-2 px-3 rounded-xl text-[11px] font-black flex items-center justify-center gap-1.5 transition btn-tactile ${
                      isLinkedRight
                        ? 'bg-gradient-to-r from-amber-500 to-amber-400 text-alch-bg shadow-sm'
                        : 'bg-alch-panel hover:bg-amber-500/20 text-amber-300 border border-amber-500/35'
                    }">
                      <i class="fa-solid fa-link"></i>
                      <span>${isLinkedRight ? `解除（${this.escapeHtml(players[idx + 1].name)}とロック中）` : `次の人（${this.escapeHtml(players[idx + 1].name)}）と共鳴リンク`}</span>
                    </button>
                  ` : `
                    <div class="py-1.5 text-center text-[11px] font-bold text-slate-500">
                      100に最も近いポジション
                    </div>
                  `}
                </div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="space-y-4 sm:space-y-5 animate-pop-in">
            ${this.renderTopicBanner(true)}

            <!-- Alchemy Tools Bar -->
            <div class="bg-alch-surface rounded-2xl p-3.5 sm:px-5 border border-white/10 flex flex-col md:flex-row items-center justify-between gap-3 shadow-mystic">
              <div class="flex items-center gap-3 text-center md:text-left">
                <div class="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-400/40 text-amber-300 flex items-center justify-center shrink-0">
                  <i class="fa-solid fa-arrow-down-1-9"></i>
                </div>
                <div>
                  <div class="font-black text-sm text-white">1位（最小）→ ${players.length}位（最大）の昇順に並べよう！</div>
                  <div class="text-[11px] text-slate-400">
                    ${this.state.enableLensMode ? '誰がどの「価値観レンズ」か推理しつつ、' : ''}数字差が10以内のペアには「共鳴リンク」を繋ごう！
                  </div>
                </div>
              </div>

              ${this.state.enableScaleCrystal ? `
                <button onclick="app.openTruthScaleModal()" class="w-full md:w-auto px-4 py-2.5 rounded-xl font-black text-xs sm:text-sm flex items-center justify-center gap-2 transition btn-tactile shrink-0 ${
                  this.state.crystalUsed
                    ? 'bg-slate-800 text-cyan-300 border border-cyan-500/40'
                    : 'bg-gradient-to-r from-cyan-500 to-emerald-500 text-alch-bg shadow-emerald-glow'
                }">
                  <i class="fa-solid fa-scale-balanced"></i>
                  <span>${this.state.crystalUsed ? '真実の天秤（啓示を再確認）' : '真実の天秤を使う（残り1回）'}</span>
                </button>
              ` : ''}
            </div>

            <!-- Cards Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              ${cardsHtml}
            </div>

            <!-- Confirm & Open Ritual Button -->
            <div class="pt-2 pb-6 max-w-xl mx-auto">
              <button onclick="app.confirmStartReveal()" class="w-full py-4 sm:py-5 rounded-3xl bg-gradient-to-r from-amber-500 via-amber-400 to-emerald-400 hover:brightness-105 text-alch-bg font-black text-lg sm:text-xl shadow-gold-glow btn-tactile flex items-center justify-center gap-3">
                <i class="fa-solid fa-wand-sparkles"></i>
                <span>調合完了！カードをオープンする</span>
              </button>
            </div>
          </div>
        `;
      },

      // --------------------------------------------------------------------------
      // VIEW 4: GRAND REVEAL & DISCREPANCY VERIFICATION BOARD
      // --------------------------------------------------------------------------
      renderRevealView() {
        const players = this.state.players;
        const res = this.state.revealResult;
        const isRevealing = this.state.isRevealing;

        const revealCardsHtml = players.map((p, idx) => {
          const isFlipped = idx < this.state.revealStep;
          const isMistake = !isRevealing && res.mistakeIndices.includes(idx);
          const isLinkedLeft = this.state.resonanceLinkIdx === idx - 1;
          const isLinkedRight = this.state.resonanceLinkIdx === idx;
          const isLinked = isLinkedLeft || isLinkedRight;

          return `
            <div id="reveal-wrapper-${idx}" class="flex flex-col">
              <div class="perspective-1000 h-64 sm:h-72 w-full">
                <div id="reveal-card-${idx}" class="flip-card-inner ${isFlipped ? 'is-flipped' : ''}">
                  <!-- Card Back -->
                  <div class="flip-card-front alchemy-card-back border-2 ${isLinked ? 'border-amber-400' : 'border-white/20'} shadow-mystic p-4 flex flex-col items-center justify-center text-white text-center">
                    <span class="px-2.5 py-0.5 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 font-num font-black text-xs mb-2">
                      予想 ${idx + 1}位
                    </span>
                    <div class="font-black text-lg mb-1">${this.escapeHtml(p.name)}</div>
                    ${p.hint ? `<div class="mt-2 px-3 py-1.5 rounded-xl bg-white/10 text-xs font-bold text-slate-200 max-w-full truncate">「${this.escapeHtml(p.hint)}」</div>` : ''}
                    <div class="mt-4 text-amber-400/50 font-display text-xs tracking-widest">SEALED</div>
                  </div>

                  <!-- Card Front (Parchment Revealed Card) -->
                  <div class="flip-card-back parchment-card border-4 ${
                    isMistake
                      ? 'border-rose-500 shadow-rose-glow'
                      : isLinked && !isRevealing && res.resonanceHit
                        ? 'border-amber-400 resonance-glow'
                        : 'border-emerald-500/80 shadow-emerald-glow'
                  } p-4 flex flex-col items-center justify-between text-center relative overflow-hidden">
                    ${isMistake ? `
                      <div class="absolute top-0 inset-x-0 bg-rose-600 text-white text-[10px] font-black py-0.5 tracking-wider">
                        <i class="fa-solid fa-burst mr-1"></i>不協和音（順番逆転！）
                      </div>
                    ` : `
                      <div class="absolute top-0 inset-x-0 bg-emerald-600 text-white text-[10px] font-black py-0.5 tracking-wider">
                        <i class="fa-solid fa-check mr-1"></i>調和（OK）
                      </div>
                    `}

                    <div class="w-full flex items-center justify-between mt-3">
                      <span class="px-2 py-0.5 rounded-lg bg-amber-900/15 text-amber-950 font-num font-black text-xs">
                        ${idx + 1}位
                      </span>
                      <span class="font-black text-sm text-slate-900 truncate max-w-[135px]">
                        ${this.escapeHtml(p.name)}
                      </span>
                    </div>

                    <div class="my-auto">
                      <div class="font-num font-black text-6xl ${isMistake ? 'text-rose-600' : 'text-slate-900'} tracking-tighter">
                        ${p.number}
                      </div>
                      ${this.state.enableLensMode ? `
                        <div class="mt-1 inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-black border ${p.lens.parchmentBadge}">
                          <i class="fa-solid ${p.lens.icon}"></i>
                          <span>${this.escapeHtml(p.lens.name.replace('レンズ', ''))}</span>
                        </div>
                      ` : ''}
                    </div>

                    <div class="w-full px-2.5 py-1.5 rounded-xl bg-white/75 border border-amber-900/15 text-xs font-bold text-slate-800 truncate">
                      ${p.hint ? `「${this.escapeHtml(p.hint)}」` : '<span class="text-slate-500">（口頭のみで表現）</span>'}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        // Verdict & Verification Board
        let verdictSection = '';
        if (!isRevealing) {
          const isFinalRound = this.state.currentRound >= this.state.totalRounds;
          const sortedPlayers = [...players].sort((a, b) => a.number - b.number);

          const verificationRows = sortedPlayers.map((p, sIdx) => {
            return `
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 rounded-2xl bg-alch-bg/90 border border-white/10 text-left">
                <div class="flex items-center gap-2.5">
                  <span class="w-9 h-9 rounded-xl parchment-card border-2 border-amber-500 text-slate-900 font-num font-black text-sm flex items-center justify-center shrink-0">
                    ${p.number}
                  </span>
                  <div>
                    <div class="font-black text-sm text-white flex flex-wrap items-center gap-1.5">
                      <span>${this.escapeHtml(p.name)}</span>
                      ${this.state.enableLensMode ? `
                        <span class="text-[11px] px-2 py-0.5 rounded-full border ${p.lens.badgeClass}">
                          <i class="fa-solid ${p.lens.icon} mr-1"></i>${this.escapeHtml(p.lens.name)}
                        </span>
                      ` : ''}
                    </div>
                    <div class="text-xs text-slate-300 mt-0.5">
                      ${p.hint ? `例えワード：「<span class="text-amber-200 font-bold">${this.escapeHtml(p.hint)}</span>」` : '<span class="text-slate-500">（例えワード未入力）</span>'}
                    </div>
                  </div>
                </div>
                <div class="text-[11px] font-bold text-emerald-300 sm:text-right shrink-0">
                  正解の昇順 ${sIdx + 1}番目
                </div>
              </div>
            `;
          }).join('');

          verdictSection = `
            <div class="rounded-3xl p-5 sm:p-6 shadow-mystic border-2 ${
              res.success
                ? 'bg-gradient-to-br from-emerald-950 via-alch-surface to-teal-950 border-emerald-400/65'
                : 'bg-gradient-to-br from-rose-950 via-alch-surface to-indigo-950 border-rose-400/65'
            } text-center animate-pop-in space-y-5">
              <div>
                <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full ${
                  res.success ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/40' : 'bg-rose-500/20 text-rose-300 border-rose-400/40'
                } border text-xs font-black mb-2">
                  <span>今回シンクロ率：${res.synchroRate}%</span>
                  <span>/</span>
                  <span>獲得：+${res.roundPoints} pt</span>
                </div>

                <h3 class="text-2xl sm:text-3xl font-black text-white mb-1">
                  ${res.success ? '✨ 価値観調合・大成功！ ✨' : '💥 不協和音… 価値観のすれ違い！'}
                </h3>

                ${this.state.resonanceLinkIdx !== null ? `
                  <div class="mt-2 inline-flex items-center gap-2 px-4 py-1.5 rounded-2xl text-xs font-black ${
                    res.resonanceHit
                      ? 'bg-gradient-to-r from-amber-500 to-amber-400 text-alch-bg shadow-gold-glow'
                      : 'bg-white/10 text-slate-300 border border-white/15'
                  }">
                    <i class="fa-solid fa-link"></i>
                    <span>
                      ${res.resonanceHit
                        ? `PERFECT RESONANCE！（完全共鳴達成・差 ${res.resonanceDiff}）+50pt ボーナス！`
                        : `共鳴リンク不発（数字の差：${res.resonanceDiff} / 昇順かつ差10以内ならず）`
                      }
                    </span>
                  </div>
                ` : ''}
              </div>

              <!-- 価値観ズレ検証ボード -->
              <div class="bg-alch-panel/75 rounded-2xl p-4 border border-white/10">
                <div class="text-xs font-black text-amber-300 mb-3 flex items-center justify-center gap-1.5">
                  <i class="fa-solid fa-magnifying-glass"></i>
                  <span>価値観ズレ検証ボード（実際の数字 ＆ レンズ正体 ＆ 例えワード）</span>
                </div>
                <div class="space-y-2 max-w-2xl mx-auto">
                  ${verificationRows}
                </div>
              </div>

              <div>
                <button onclick="app.nextRoundOrFinish()" class="px-8 py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-emerald-400 text-alch-bg font-black text-base sm:text-lg shadow-gold-glow btn-tactile inline-flex items-center gap-2">
                  <span>${isFinalRound ? '最終称号・シンクロ診断へ進む' : `次のラウンド（R${this.state.currentRound + 1}/${this.state.totalRounds}）へ`}</span>
                  <i class="fa-solid fa-arrow-right"></i>
                </button>
              </div>
            </div>
          `;
        } else {
          verdictSection = `
            <div class="bg-alch-surface border border-amber-500/35 rounded-3xl p-4 sm:p-5 text-center shadow-mystic flex flex-col sm:flex-row items-center justify-between gap-3">
              <div class="font-black text-sm sm:text-lg text-amber-300 flex items-center gap-2.5">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <span>魔導陣起動中… 左から順番にカードを開示しています…</span>
              </div>
              <button onclick="app.skipRevealAnimation()" class="px-4 py-2 rounded-xl bg-alch-panel hover:bg-indigo-900 text-slate-200 border border-white/15 text-xs font-bold shrink-0">
                <i class="fa-solid fa-forward-fast mr-1"></i>一括オープン
              </button>
            </div>
          `;
        }

        return `
          <div class="space-y-4 sm:space-y-5">
            ${this.renderTopicBanner(false)}

            ${verdictSection}

            <!-- Revealed Cards Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-6">
              ${revealCardsHtml}
            </div>
          </div>
        `;
      },

      // --------------------------------------------------------------------------
      // VIEW 5: FINAL CAMPAIGN RESULT & TEAM TITLE DIAGNOSIS
      // --------------------------------------------------------------------------
      renderFinalResultView() {
        const diag = this.getFinalTeamDiagnosis();
        const history = this.state.roundHistory;

        const historyRows = history.map(h => `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 p-3 rounded-2xl bg-alch-bg/85 border border-white/10 text-xs">
            <div class="flex items-center gap-2 min-w-0">
              <span class="px-2 py-0.5 rounded-lg bg-amber-500/20 text-amber-300 font-num font-black shrink-0">R${h.round}</span>
              <span class="font-bold text-slate-100 truncate">${this.escapeHtml(h.topicTitle)}</span>
            </div>
            <div class="flex items-center gap-2 shrink-0 self-end sm:self-auto">
              ${h.resonanceHit ? '<span class="px-2 py-0.5 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 text-[10px] font-black"><i class="fa-solid fa-link mr-1"></i>完全共鳴</span>' : ''}
              <span class="px-2 py-0.5 rounded-full font-black text-[11px] ${h.success ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}">
                ${h.success ? '成功' : 'ズレ発生'}
              </span>
              <span class="font-num font-black text-sm text-white w-12 text-right">${h.synchroRate}%</span>
            </div>
          </div>
        `).join('');

        return `
          <div class="max-w-3xl w-full mx-auto space-y-5 animate-pop-in pb-8">
            <div class="bg-gradient-to-br from-alch-surface via-alch-panel to-indigo-950 rounded-3xl p-6 sm:p-8 shadow-mystic border-2 border-amber-400/50 text-center relative overflow-hidden">
              <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-3xl bg-gradient-to-br from-amber-400 via-amber-500 to-emerald-500 text-alch-bg flex items-center justify-center text-3xl sm:text-4xl mx-auto mb-3 shadow-gold-glow">
                <i class="fa-solid ${diag.teamTitle.icon}"></i>
              </div>

              <div class="font-display text-xs tracking-[0.25em] text-amber-300 font-bold">FINAL ALCHEMY RANK</div>
              <h2 class="text-2xl sm:text-4xl font-black ${diag.teamTitle.color} mt-1 mb-2 leading-tight">
                【${diag.teamTitle.title}】
              </h2>
              <p class="text-xs sm:text-sm text-slate-200 max-w-xl mx-auto leading-relaxed mb-6">
                ${diag.teamTitle.desc}
              </p>

              <!-- Key Metrics -->
              <div class="grid grid-cols-3 gap-2.5 sm:gap-4 mb-5">
                <div class="p-3 sm:p-4 rounded-2xl bg-alch-bg/90 border border-amber-500/35">
                  <div class="text-[10px] sm:text-xs font-bold text-slate-400">平均シンクロ率</div>
                  <div class="font-num font-black text-2xl sm:text-4xl text-amber-300 mt-0.5">${diag.avgSynchro}%</div>
                </div>
                <div class="p-3 sm:p-4 rounded-2xl bg-alch-bg/90 border border-emerald-500/35">
                  <div class="text-[10px] sm:text-xs font-bold text-slate-400">調合成功数</div>
                  <div class="font-num font-black text-2xl sm:text-4xl text-emerald-400 mt-0.5">${diag.successCount}/${diag.totalRounds}</div>
                </div>
                <div class="p-3 sm:p-4 rounded-2xl bg-alch-bg/90 border border-cyan-500/35">
                  <div class="text-[10px] sm:text-xs font-bold text-slate-400">総合スコア</div>
                  <div class="font-num font-black text-2xl sm:text-4xl text-cyan-300 mt-0.5">${this.state.totalScore}</div>
                </div>
              </div>

              <!-- Best Resonance Pair -->
              <div class="p-3.5 rounded-2xl bg-amber-500/10 border border-amber-400/35 text-xs sm:text-sm font-bold text-amber-200 flex items-center justify-center gap-2 mb-6">
                <i class="fa-solid fa-link text-amber-400"></i>
                <span>ベスト共鳴ペア：<strong>${this.escapeHtml(diag.bestPairText)}</strong></span>
              </div>

              <!-- Round History -->
              <div class="text-left space-y-2 mb-6">
                <div class="text-xs font-black text-slate-300 px-1">
                  <i class="fa-solid fa-scroll mr-1.5 text-amber-400"></i>全ラウンド調合記録
                </div>
                ${historyRows}
              </div>

              <!-- Action Buttons -->
              <div class="space-y-3">
                <button onclick="app.copyShareText()" class="w-full py-3.5 rounded-2xl bg-alch-bg hover:bg-indigo-950 border border-amber-400/50 text-amber-300 font-black text-sm sm:text-base flex items-center justify-center gap-2 transition btn-tactile">
                  <i class="fa-solid fa-copy"></i>
                  <span>診断結果をコピーしてシェアする</span>
                </button>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <button onclick="app.startGame()" class="py-4 rounded-2xl bg-gradient-to-r from-amber-500 via-amber-400 to-emerald-400 text-alch-bg font-black text-base shadow-gold-glow btn-tactile flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>同じメンバーでもう一度！</span>
                  </button>
                  <button onclick="app.resetToSetup()" class="py-4 rounded-2xl bg-white/10 hover:bg-white/20 text-white font-bold text-base transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-sliders"></i>
                    <span>設定・メンバー変更へ</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      app.init();
    });
  </script>
</body>
</html>
